services:
  lersha_training_management_system_dev:
    build:
      context: .
      dockerfile: ./Dockerfile.dev
    environment:
      - NODE_OPTIONS=--max-old-space-size=10240
    ports:
      - "4499:4499"
    networks:
      - shared_LTMS_network
    volumes:
      - LTMS_uploads_volume_dev:/app/uploads
    restart: always

networks:
  shared_LTMS_network:
    external: true

volumes:
  LTMS_uploads_volume_dev: {}
