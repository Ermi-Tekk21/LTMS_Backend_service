services:
  lersha_training_management_system_dev:
    build:
      context: .
      dockerfile: ./Dockerfile.dev
    environment:
      - NODE_OPTIONS=--max-old-space-size=10240
    ports:
      - "4499:4499"
    networks:
      - LTMS_network
    volumes:
      - LTMS_uploads_volume_dev:/app/uploads
    restart: always

networks:
  LTMS_network:
    driver: bridge

volumes:
  LTMS_uploads_volume_dev: {}
